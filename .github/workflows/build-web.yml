name: Build Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Satu paket update: frontend utama + minisketch + invoice.
      # Path prefix dipakai untuk routing di app:
      #   frontend/dist  -> /            (UI utama)
      #   minisketch     -> /sketcher/
      #   tools_invoice  -> /invoice.html
      - name: Collect web bundle
        run: |
          mkdir -p bundle/frontend bundle/minisketch bundle/tools_invoice
          cp -r frontend/dist/. bundle/frontend/
          cp -r minisketch/. bundle/minisketch/
          cp -r tools_invoice/. bundle/tools_invoice/
          # junk filter (SMB leftovers, dsb)
          find bundle -name ".__smb*" -delete 2>/dev/null || true
          find bundle -name "._*" -delete 2>/dev/null || true
          find bundle -name ".DS_Store" -delete 2>/dev/null || true
          find bundle -name "Thumbs.db" -delete 2>/dev/null || true
          find bundle -name "desktop.ini" -delete 2>/dev/null || true
          find bundle -name "*.md" -delete 2>/dev/null || true
          echo "bundle size: $(du -sh bundle | cut -f1), files: $(find bundle -type f | wc -l)"

      - name: Generate manifest.json (sha256 per file)
        working-directory: bundle
        run: |
          export VERSION="$(date +%Y.%m.%d.%H%M)-${GITHUB_SHA::7}"
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path");
            const files = [];
            (function walk(dir) {
              for (const e of fs.readdirSync(dir, {withFileTypes: true})) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) walk(p);
                else {
                  const buf = fs.readFileSync(p);
                  files.push({
                    path: path.relative(".", p).split(path.sep).join("/"),
                    sha256: crypto.createHash("sha256").update(buf).digest("hex"),
                    size: buf.length
                  });
                }
              }
            })(".");
            const manifest = { version: process.env.VERSION, files };
            fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2));
            console.log("manifest:", manifest.version, files.length, "files");
          '
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Delete old release
        run: |
          gh release delete web-latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with assets
        run: |
          gh release create web-latest \
            --title "Web $VERSION" \
            --notes "Auto-generated web build $VERSION (frontend + minisketch + invoice)" \
            --latest
          # GITHUB_TOKEN kadang membuat release sebagai draft saat tag baru —
          # publish eksplisit supaya raw download URL langsung bisa diakses.
          gh release edit web-latest --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload all bundle files
        run: |
          cd bundle
          mkdir -p /tmp/upload
          # flatten: minisketch/app.js -> minisketch__app.js
          (cd . && find . -type f | while read f; do
            rel="${f#./}"
            cp "$f" "/tmp/upload/${rel//\//__}"
          done)
          gh release upload web-latest /tmp/upload/* --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
