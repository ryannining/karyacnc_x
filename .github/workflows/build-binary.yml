name: Build Binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            exe: karyacnc.exe
          - os: ubuntu-latest
            name: linux
            exe: karyacnc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Patch Go for baseline x86-64 (Linux only)
        if: matrix.name == 'linux'
        run: |
          GOROOT=$(go env GOROOT)
          # math/archExp (exp_amd64.s) uses FMA (x86-64-v3). Remove the .s and
          # provide a pure-Go fallback so the binary runs on any x86-64 CPU.
          rm -f "$GOROOT/src/math/exp_amd64.s"
          cat > "$GOROOT/src/math/exp_asm.go" << 'EOF'
          //go:build amd64

          package math

          const haveArchExp = false

          func archExp(x float64) float64 { return exp(x) }
          EOF
          # exp2 has no .s on amd64; restrict exp2_asm.go to archs that have one
          cat > "$GOROOT/src/math/exp2_asm.go" << 'EOF'
          // Copyright 2021 The Go Authors. All rights reserved.
          // Use of this source code is governed by a BSD-style
          // license that can be found in the LICENSE file.

          //go:build arm64 || loong64 || s390x

          package math

          const haveArchExp2 = true

          func archExp2(x float64) float64
          EOF
          go env -w GOAMD64=v1
          echo "GOROOT patched for x86-64-baseline"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libnss3-dev libasound2-dev pkg-config
          # Wails v2.11 hardcode webkit2gtk-4.0; ubuntu 24 ships 4.1 only
          sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc
          pkg-config --modversion webkit2gtk-4.0

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build binary (Linux)
        if: matrix.name == 'linux'
        run: wails build -debug

      - name: Strip ISA note (Linux, fix old CPU)
        if: matrix.name == 'linux'
        run: |
          # .note.gnu.property claims x86-64-v3 (from AESENC/PSHUFB in runtime
          # hash asm, guarded by runtime CPU check). The note makes the kernel
          # refuse to load the binary on older CPUs. Instruction-level v3
          # instrs (vfmadd etc.) are already removed by the Go patch above;
          # the remaining SSE/AES ops all exist on baseline+SSSE3 CPUs.
          objcopy -R .note.gnu.property build/bin/karyacnc
          readelf -n build/bin/karyacnc | grep -i "x86 ISA" || echo "ISA note removed"

      - name: Build binary (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: wails build -debug

      - name: Rename binary
        shell: pwsh
        run: |
          $name = "${{ matrix.name }}"
          $exe = "${{ matrix.exe }}"
          $src = "build/bin/$exe"
          $dst = "karyacnc-$name-${{ github.event.inputs.version }}$([System.IO.Path]::GetExtension($exe))"
          Copy-Item $src $dst
          Write-Host "Built: $dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karyacnc-${{ matrix.name }}
          path: karyacnc-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete old binary releases
        run: |
          # simpan hanya release binary terbaru — versi lama dihapus biar
          # customer tidak salah download.
          CURRENT="${{ github.event.inputs.version }}"
          gh release list --limit 50 --json tagName,isDraft --jq '.[] | select(.tagName | test("^v[0-9]+\\.")) | .tagName' | while read -r tag; do
            if [ "$tag" != "$CURRENT" ]; then
              echo "hapus release lama: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create ${{ github.event.inputs.version }} \
            --title "KaryaCNC ${{ github.event.inputs.version }}" \
            --notes "Binary release ${{ github.event.inputs.version }}" \
            artifacts/karyacnc-windows/* artifacts/karyacnc-linux/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
