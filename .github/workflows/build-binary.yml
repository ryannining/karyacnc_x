name: Build Binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            exe: karyacnc.exe
          - os: ubuntu-latest
            name: linux
            exe: karyacnc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails (Linux only)
        if: matrix.name == 'linux'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libnss3-dev libasound2-dev pkg-config

      - name: Install Wails (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build binary (Linux)
        if: matrix.name == 'linux'
        run: wails build

      - name: Build binary (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: wails build

      - name: Rename binary
        shell: pwsh
        run: |
          $name = "${{ matrix.name }}"
          $exe = "${{ matrix.exe }}"
          $src = "build/bin/$exe"
          $dst = "karyacnc-$name-${{ github.event.inputs.version }}$([System.IO.Path]::GetExtension($exe))"
          Copy-Item $src $dst
          Write-Host "Built: $dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karyacnc-${{ matrix.name }}
          path: karyacnc-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        run: |
          gh release create ${{ github.event.inputs.version }} \
            --title "KaryaCNC ${{ github.event.inputs.version }}" \
            --notes "Binary release ${{ github.event.inputs.version }}" \
            artifacts/karyacnc-windows/* artifacts/karyacnc-linux/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
