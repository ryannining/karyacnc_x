
    <div>
        <h2>Machine Connection</h2>
        <input id="machineIp" type="text" placeholder="192.168.1.100" />
        <input id="machinePort" type="number" value="8888" />
        <button onclick="connectMachine()">Connect</button>
    </div>
    
    <div>
        <h2>Machine Position</h2>
        <p>X: <span id="posX">0</span></p>
        <p>Y: <span id="posY">0</span></p>
        <p>Z: <span id="posZ">0</span></p>
        <p>Velocity: <span id="velocity">0</span></p>
        <p>Machine ID: <span id="machineId">0</span></p>
    </div>
    
    <div>
        <h2>Configuration</h2>
        <p>Max Speed: <span id="maxSpeed">-</span></p>
        <p>Acceleration: <span id="accel">-</span></p>
    </div>
